[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-manager-course-project"
version = "1.0.0"
description = "Week 3 object-oriented library loan manager"
requires-python = ">=3.11"

[project.scripts]
library-manager = "library_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

